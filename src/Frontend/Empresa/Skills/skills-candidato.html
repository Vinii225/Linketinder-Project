<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Linketinder - Perfil Empresa</title>
    <link rel="stylesheet" href="skills-candidato-style.css">
</head>
<body>
<div class="container-wide">
    <a href="../../index.html" class="btn-voltar">Voltar</a>

    <section class="dashboard">
        <div class="lista-candidatos">
            <h2>Candidatos Interessados (Anônimo)</h2>
            <table id="tabela-anonima">
                <thead>
                <tr>
                    <th>Competências (Skills)</th>
                    <th>Formação/Descrição</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Java, Groovy, Spring</td>
                    <td>Dev Java com experiência em PB</td>
                </tr>
                <tr>
                    <td>Angular, CSS, HTML</td>
                    <td>Especialista em Front-end</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="painel-grafico">
            <h2>Distribuição de Competências</h2>
            <canvas id="skillsChart"></canvas>
        </div>
    </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="../../dist/types.js" defer></script>
<script src="../../dist/validacao.js" defer></script>
<script src="../../dist/storage.js" defer></script>
<script src="../../dist/Empresa/Cadastro/cadastro.js" defer></script>
</body>
</html>
