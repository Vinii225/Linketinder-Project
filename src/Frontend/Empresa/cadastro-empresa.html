<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linketinder - Cadastro Empresa</title>
    <link rel="stylesheet" href="cadastro-empresa-style.css">
</head>
<body>
<div class="container">
    <a href="../index.html" class="btn-voltar">Voltar</a>

    <h2>Cadastro de Empresa</h2>

    <form id="form-empresa">
        <div class="campo">
            <label for="e-nome">Nome da Empresa:</label>
            <input type="text" id="e-nome" placeholder="Ex: Nome da Empresa" required>
        </div>

        <div class="campo">
            <label for="e-cnpj">CNPJ:</label>
            <input type="text" id="e-cnpj" placeholder="00.000.000/0001-00" required>
        </div>

        <div class="campo">
            <label for="e-email">E-mail Corporativo:</label>
            <input type="email" id="e-email" placeholder="rh@empresa.com" required>
        </div>

        <div class="campo">
            <label for="e-vagas">Descrição da Vaga:</label>
            <input type="text" id="e-vagas" placeholder="Ex: Desenvolvedor Java, Suporte" required>
        </div>

        <div class="campo">
            <label for="e-skills">Competências Desejadas:</label>
            <input type="text" id="e-skills" placeholder="Java, SQL, Spring Boot" required>
        </div>

        <button type="submit" class="btn">Cadastrar Empresa</button>
    </form>
</div>
</body>
</html>
