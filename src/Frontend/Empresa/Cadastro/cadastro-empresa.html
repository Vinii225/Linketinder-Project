<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linketinder - Cadastro groovy.model.Empresa</title>
    <link rel="stylesheet" href="cadastro-empresa-style.css">
</head>
<body>
<div class="container">
    <a href="../../index.html" class="btn-voltar">Voltar</a>

    <h2>Cadastro de groovy.model.Empresa</h2>
    <div id="cadastro-aviso" class="aviso" aria-live="polite"></div>

    <form id="form-empresa">
        <div class="campo">
            <label for="e-nome">Nome da groovy.model.Empresa:</label>
            <input type="text" id="e-nome" placeholder="Ex: Nome da groovy.model.Empresa" required>
        </div>

        <div class="campo">
            <label for="e-cnpj">CNPJ:</label>
            <input type="text" id="e-cnpj" placeholder="00.000.000/0001-00" required>
        </div>

        <div class="campo">
            <label for="e-email">E-mail Corporativo:</label>
            <input type="email" id="e-email" placeholder="rh@empresa.com" required>
        </div>

        <div class="campo">
            <label for="e-descricao">Descricao da groovy.model.Empresa:</label>
            <input type="text" id="e-descricao" placeholder="Resumo sobre a empresa" required>
        </div>

        <div class="campo">
            <label for="e-cep">CEP:</label>
            <input type="text" id="e-cep" placeholder="00000-000" required>
        </div>

        <div class="campo">
            <label for="e-skills">Competências Desejadas:</label>
            <input type="text" id="e-skills" placeholder="Java, SQL, Spring Boot" required>
        </div>

        <button type="submit" class="btn">Cadastrar groovy.model.Empresa</button>
    </form>
</div>
<script src="../../dist/types.js" defer></script>
<script src="../../dist/validacao.js" defer></script>
<script src="../../dist/storage.js" defer></script>
<script src="../../dist/Empresa/Cadastro/cadastro.js" defer></script>
</body>
</html>
