<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Linketinder - Cadastro Candidato</title>
    <link rel="stylesheet" href="cadastro-candidato-style.css">
</head>
<body>
<div class="container">
    <a href="../../index.html" class="btn-voltar">Voltar</a>
    <h2>Cadastro de Candidato</h2>
    <div id="cadastro-aviso" class="aviso" aria-live="polite"></div>

    <form id="form-candidato">
        <div class="campo">
            <label for="c-nome">Nome:</label>
            <input type="text" id="c-nome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="c-data-nasc">Data de Nascimento:</label>
            <input type="date" id="c-data-nasc" required>
        </div>

        <div class="campo">
            <label for="c-email">E-mail:</label>
            <input type="email" id="c-email" placeholder="nome@email.com" required>
        </div>

        <div class="campo">
            <label for="c-cpf">CPF:</label>
            <input type="text" id="c-cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="campo">
            <label for="c-cep">CEP:</label>
            <input type="text" id="c-cep" placeholder="00000-000" required>
        </div>

        <div class="campo">
            <label for="c-descricao">Descricao Pessoal:</label>
            <input type="text" id="c-descricao" placeholder="Resumo profissional" required>
        </div>

        <div class="campo">
            <label for="c-skills">Suas Skills:</label>
            <input type="text" id="c-skills" placeholder="Java, Groovy, SQL" required>
        </div>

        <button type="submit" class="btn">Finalizar Cadastro</button>
    </form>
</div>
<script src="../../dist/types.js" defer></script>
<script src="../../dist/validacao.js" defer></script>
<script src="../../dist/storage.js" defer></script>
<script src="../../dist/Candidato/Cadastro/cadastro.js" defer></script>
</body>
</html>
